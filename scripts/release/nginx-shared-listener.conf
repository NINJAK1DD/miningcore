events {
}

http {
    server {
        listen 8080;

        # Keep this before other regular-expression locations. A public ^~ location would
        # prevent nginx from evaluating this case-insensitive protected-route boundary.
        location ~* ^/(?:api/admin|metrics)(?:/|$) {
            return 404;
        }

        location / {
            proxy_pass http://miningcore-api-shared:4000;
        }
    }
}
