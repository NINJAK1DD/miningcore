version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  groups:
    github-actions:
      patterns: ["*"]
  commit-message:
    prefix: "ci(actions)"
  open-pull-requests-limit: 10
- package-ecosystem: nuget
  directory: "/src/Miningcore"
  schedule:
    interval: monthly
  groups:
    dotnet-servicing:
      patterns:
        - "Microsoft.Extensions.*"
        - "System.Security.Cryptography.Pkcs"
      update-types: ["patch"]
  commit-message:
    prefix: "chore(deps)"
  open-pull-requests-limit: 10
