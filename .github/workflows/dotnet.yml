name: .NET

on:
  push:
    branches: [ master, dev, ravencoin-rollback ]
  pull_request:
    branches: [ master, dev, ravencoin-rollback ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Build dependencies
      run: sudo apt-get install -y cmake cmake ninja-build build-essential libssl-dev pkg-config libboost-all-dev libsodium-dev libzmq5 libgmp-dev

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 6.0.x

    - name: Restore dependencies
      run: dotnet restore src

    - name: Build
      run: dotnet build --no-restore src

    - name: Stage Linux native libs for tests
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail

        APP_OUT="$GITHUB_WORKSPACE/src/Miningcore/bin/Debug/net6.0"
        TEST_OUT="$GITHUB_WORKSPACE/src/Miningcore.Tests/bin/Debug/net6.0"

        echo "Miningcore output directory: $APP_OUT"
        echo "Miningcore.Tests output directory: $TEST_OUT"

        mkdir -p "$TEST_OUT"

        echo
        echo "Native libs currently in Miningcore output:"
        find "$APP_OUT" -maxdepth 1 -type f -name '*.so' -print | sort || true

        if ! compgen -G "$APP_OUT/*.so" > /dev/null; then
          echo "No native .so files were found in $APP_OUT"
          echo "Searching the workspace for built native libraries..."

          mapfile -t FOUND_LIBS < <(
            find "$GITHUB_WORKSPACE" -type f -name '*.so' \
              ! -path '*/obj/*' \
              ! -path '*/.git/*' \
              ! -path '*/src/Miningcore.Tests/bin/*' \
              | sort
          )

          if [ "${#FOUND_LIBS[@]}" -eq 0 ]; then
            echo "No native .so files found anywhere in the workspace."
            exit 1
          fi

          echo "Found native libs in workspace:"
          printf '%s\n' "${FOUND_LIBS[@]}"

          for so in "${FOUND_LIBS[@]}"; do
            cp -av "$so" "$APP_OUT/"
          done
        fi

        echo
        echo "Copying native libs into test output..."
        cp -av "$APP_OUT"/*.so "$TEST_OUT/"

        echo
        echo "Miningcore output libs:"
        find "$APP_OUT" -maxdepth 1 -type f -name '*.so' -print | sort

        echo
        echo "Miningcore.Tests output libs:"
        find "$TEST_OUT" -maxdepth 1 -type f -name '*.so' -print | sort

    - name: Diagnose Lyra2 compiler sensitivity
      if: runner.os == 'Linux'
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/src/Miningcore/bin/Debug/net6.0:${{ github.workspace }}/src/Miningcore.Tests/bin/Debug/net6.0
      run: |
        set -euo pipefail

        NATIVE_DIR="$GITHUB_WORKSPACE/src/Native/libmultihash"
        APP_OUT="$GITHUB_WORKSPACE/src/Miningcore/bin/Debug/net6.0"
        TEST_OUT="$GITHUB_WORKSPACE/src/Miningcore.Tests/bin/Debug/net6.0"
        COMMON_FLAGS="-g -Wall -c -fPIC -Wno-pointer-sign -Wno-char-subscripts -Wno-unused-variable -Wno-unused-function -Wno-strict-aliasing -Wno-discarded-qualifiers -Wno-unused-const-variable"
        CPU_FLAGS="-maes -msse2 -mssse3 -mpclmul -mavx -mavx2"
        FEATURE_FLAGS="-D__AES__ -DHAVE_SSE2 -DHAVE_SSSE3 -DHAVE_PCLMUL -DHAVE_AVX -DHAVE_AVX2"
        OBJECTS=(Lyra2.o Lyra2RE.o Sponge.o sha3/sph_blake.o sha3/sph_keccak.o sha3/sph_cubehash.o sha3/sph_skein.o sha3/sph_bmw.o)

        run_variant() {
          local name="$1"
          local optimization_flags="$2"

          echo "=== Lyra2 variant: $name ($optimization_flags) ==="
          (
            cd "$NATIVE_DIR"
            rm -f libmultihash.so "${OBJECTS[@]}"
            make CFLAGS="$COMMON_FLAGS $CPU_FLAGS $FEATURE_FLAGS $optimization_flags"
          )
          cp "$NATIVE_DIR/libmultihash.so" "$APP_OUT/libmultihash.so"
          cp "$NATIVE_DIR/libmultihash.so" "$TEST_OUT/libmultihash.so"
          dotnet test src/Miningcore.Tests/Miningcore.Tests.csproj \
            --no-build \
            --filter "FullyQualifiedName=Miningcore.Tests.Crypto.HashingTests.Lyra2Rev2_Hash" \
            --logger:"console;verbosity=normal" || true
        }

        run_variant "O0" "-O0"
        run_variant "O1" "-O1"
        run_variant "O2-no-vectorize" "-O2 -fno-tree-vectorize"
        run_variant "O2-no-slp" "-O2 -fno-tree-slp-vectorize"
        run_variant "O2-no-alias" "-O2 -fno-strict-aliasing"
        run_variant "O2-no-vectorize-no-alias" "-O2 -fno-tree-vectorize -fno-strict-aliasing"
        run_variant "O2-avx512-target" "-O2 -mavx512f"

    - name: Test
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/src/Miningcore/bin/Debug/net6.0:${{ github.workspace }}/src/Miningcore.Tests/bin/Debug/net6.0
      run: dotnet test --logger:"console;verbosity=detailed" --no-build --verbosity normal src
