name: .NET

on:
  push:
    branches: [ master, dev, ravencoin-rollback ]
  pull_request:
    branches: [ master, dev, ravencoin-rollback ]

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: miningcore
          POSTGRES_PASSWORD: miningcore-test
          POSTGRES_DB: miningcore_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miningcore -d miningcore_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Validate administrative API documentation
      shell: bash
      run: bash scripts/release/test-admin-api-docs.sh

    - name: Validate wallet-backup documentation
      shell: bash
      run: bash scripts/release/test-wallet-backup-docs.sh

    - name: Validate documentation links
      shell: bash
      run: python3 scripts/release/test-doc-links.py

    - name: Install Build dependencies
      # The ZeroMQ .NET binding loads the unversioned libzmq.so name. The runtime-only
      # libzmq5 package provides libzmq.so.5, while libzmq3-dev also provides the
      # unversioned linker/loader symlink required by relay integration tests.
      run: |
        sudo apt-get -o Acquire::Retries=3 update
        sudo apt-get -o Acquire::Retries=3 install -y \
          cmake ninja-build build-essential libssl-dev pkg-config \
          libboost-all-dev libsodium-dev libzmq3-dev libgmp-dev

    - name: Install pinned Bitcoin Core regtest dependency
      shell: bash
      env:
        BITCOIN_CORE_VERSION: 28.1
        BITCOIN_CORE_SHA256: 07f77afd326639145b9ba9562912b2ad2ccec47b8a305bd075b4f4cb127b7ed7
      run: |
        set -euo pipefail

        archive="bitcoin-${BITCOIN_CORE_VERSION}-x86_64-linux-gnu.tar.gz"
        archive_path="$RUNNER_TEMP/$archive"
        install_root="$RUNNER_TEMP/bitcoin-${BITCOIN_CORE_VERSION}"

        curl --fail --location --retry 3 --output "$archive_path" \
          "https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_CORE_VERSION}/$archive"
        echo "$BITCOIN_CORE_SHA256  $archive_path" | sha256sum --check --strict
        tar -xzf "$archive_path" -C "$RUNNER_TEMP"
        test -x "$install_root/bin/bitcoind"

        echo "MININGCORE_TEST_BITCOIND=$install_root/bin/bitcoind" >> "$GITHUB_ENV"

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore src

    - name: Build
      run: dotnet build --no-restore src

    - name: Stage Linux native libs for tests
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail

        APP_OUT="$GITHUB_WORKSPACE/src/Miningcore/bin/Debug/net10.0"
        TEST_OUT="$GITHUB_WORKSPACE/src/Miningcore.Tests/bin/Debug/net10.0"

        echo "Miningcore output directory: $APP_OUT"
        echo "Miningcore.Tests output directory: $TEST_OUT"

        mkdir -p "$TEST_OUT"

        echo
        echo "Native libs currently in Miningcore output:"
        find "$APP_OUT" -maxdepth 1 -type f -name '*.so' -print | sort || true

        if ! compgen -G "$APP_OUT/*.so" > /dev/null; then
          echo "No native .so files were found in $APP_OUT"
          echo "Searching the workspace for built native libraries..."

          mapfile -t FOUND_LIBS < <(
            find "$GITHUB_WORKSPACE" -type f -name '*.so' \
              ! -path '*/obj/*' \
              ! -path '*/.git/*' \
              ! -path '*/src/Miningcore.Tests/bin/*' \
              | sort
          )

          if [ "${#FOUND_LIBS[@]}" -eq 0 ]; then
            echo "No native .so files found anywhere in the workspace."
            exit 1
          fi

          echo "Found native libs in workspace:"
          printf '%s\n' "${FOUND_LIBS[@]}"

          for so in "${FOUND_LIBS[@]}"; do
            cp -av "$so" "$APP_OUT/"
          done
        fi

        echo
        echo "Copying native libs into test output..."
        cp -av "$APP_OUT"/*.so "$TEST_OUT/"

        echo
        echo "Miningcore output libs:"
        find "$APP_OUT" -maxdepth 1 -type f -name '*.so' -print | sort

        echo
        echo "Miningcore.Tests output libs:"
        find "$TEST_OUT" -maxdepth 1 -type f -name '*.so' -print | sort

    - name: Smoke-test ZeroMQ relay runtime
      if: runner.os == 'Linux'
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/src/Miningcore/bin/Debug/net10.0:${{ github.workspace }}/src/Miningcore.Tests/bin/Debug/net10.0
      run: >-
        dotnet test --no-build --verbosity normal
        --filter "FullyQualifiedName~Miningcore.Tests.Mining.ShareReceiverTests"
        src/Miningcore.Tests/Miningcore.Tests.csproj

    - name: Test
      shell: bash
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/src/Miningcore/bin/Debug/net10.0:${{ github.workspace }}/src/Miningcore.Tests/bin/Debug/net10.0
        MININGCORE_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=miningcore;Password=miningcore-test;Database=miningcore_tests
      run: dotnet test --logger:"console;verbosity=detailed" --no-build --verbosity normal src

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore src/Miningcore/Miningcore.csproj --runtime win-x64

    - name: Publish Windows build
      run: >-
        dotnet publish src/Miningcore/Miningcore.csproj
        --no-restore
        --configuration Release
        --framework net10.0
        --runtime win-x64
        --self-contained false
        --output build/windows-x64

    - name: Smoke-test Windows build
      run: .\build\windows-x64\Miningcore.exe --version

    - name: Restore Windows native smoke test
      run: dotnet restore src/Miningcore.Tests/Miningcore.Tests.csproj

    - name: Test Windows share recovery safety
      run: >-
        dotnet test src/Miningcore.Tests/Miningcore.Tests.csproj
        --no-restore
        --configuration Release
        --framework net10.0
        --filter "FullyQualifiedName~Miningcore.Tests.Mining.ShareRecorderTests|FullyQualifiedName~Miningcore.Tests.Mining.ShareRecoveryPathOwnershipTests|FullyQualifiedName~Miningcore.Tests.ProgramPoolTemplateTests"

    - name: Test Windows log rotation
      run: >-
        dotnet test src/Miningcore.Tests/Miningcore.Tests.csproj
        --no-restore
        --configuration Release
        --framework net10.0
        --filter "FullyQualifiedName~Miningcore.Tests.ProgramLoggingTests"

    - name: Test Windows Stratum listener lifecycle
      run: >-
        dotnet test src/Miningcore.Tests/Miningcore.Tests.csproj
        --no-restore
        --configuration Release
        --framework net10.0
        --filter "(FullyQualifiedName~Miningcore.Tests.Stratum.StratumConnectionTests|FullyQualifiedName~Miningcore.Tests.Stratum.StratumListenerReservationCoordinatorTests|FullyQualifiedName~Miningcore.Tests.StratumListenerConfigurationTests|FullyQualifiedName~Miningcore.Tests.Stratum.StratumServerTests|FullyQualifiedName~Miningcore.Tests.Stratum.StratumListenerPortabilityTests)&FullyQualifiedName!~RunAsync_WithPasswordProtectedPfx_CompletesTlsHandshake"

    - name: Smoke-test Windows SCCPow runtime
      run: >-
        dotnet test src/Miningcore.Tests/Miningcore.Tests.csproj
        --no-restore
        --configuration Release
        --framework net10.0
        --filter "FullyQualifiedName~Miningcore.Tests.Native.SccPowTests"
