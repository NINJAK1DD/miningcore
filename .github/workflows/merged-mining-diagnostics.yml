name: Merged-mining diagnostics

on:
  pull_request:
    branches: [ dev ]

jobs:
  build-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 6.0.x
      - name: Restore
        run: dotnet restore src
      - name: Capture build output
        shell: bash
        run: |
          set +e
          dotnet build --no-restore src > merged-mining-build.log 2>&1
          status=$?
          echo "$status" > merged-mining-build.exitcode
          exit 0
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: merged-mining-build-log
          path: |
            merged-mining-build.log
            merged-mining-build.exitcode
      - name: Enforce build result
        shell: bash
        run: exit "$(cat merged-mining-build.exitcode)"
