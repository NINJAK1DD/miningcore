name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ dev ]
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/**'
      - 'scripts/release/**'
      - 'docs/**'
      - 'config.example.json'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-release:
    name: Test and package Ubuntu 22.04 x64
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: miningcore
          POSTGRES_PASSWORD: miningcore-test
          POSTGRES_DB: miningcore_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miningcore -d miningcore_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tags must use SemVer, for example v0.1.0-rc.1 or v0.1.0"
            exit 1
          fi

          git fetch --no-tags origin dev
          if ! git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" origin/dev; then
            echo "Release tag $GITHUB_REF_NAME does not point to a commit reachable from dev"
            exit 1
          fi

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="v0.0.0-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install build and runtime dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          cmake ninja-build build-essential libssl-dev pkg-config
          libboost-all-dev libsodium-dev libzmq3-dev libgmp-dev file

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 6.0.x

      - name: Restore dependencies
        run: dotnet restore src

      - name: Build
        run: dotnet build --no-restore src

      - name: Stage Linux native libraries for tests
        shell: bash
        run: |
          set -euo pipefail

          app_out="$GITHUB_WORKSPACE/src/Miningcore/bin/Debug/net6.0"
          test_out="$GITHUB_WORKSPACE/src/Miningcore.Tests/bin/Debug/net6.0"
          mkdir -p "$test_out"

          if ! compgen -G "$app_out/*.so" > /dev/null; then
            echo "No native libraries were produced in $app_out"
            exit 1
          fi

          cp -av "$app_out"/*.so "$test_out/"

      - name: Smoke-test ZeroMQ relay runtime
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/src/Miningcore/bin/Debug/net6.0:${{ github.workspace }}/src/Miningcore.Tests/bin/Debug/net6.0
        run: >-
          dotnet test --no-build --verbosity normal
          --filter "FullyQualifiedName~Miningcore.Tests.Mining.ShareReceiverTests"
          src/Miningcore.Tests/Miningcore.Tests.csproj

      - name: Run complete test suite
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/src/Miningcore/bin/Debug/net6.0:${{ github.workspace }}/src/Miningcore.Tests/bin/Debug/net6.0
          MININGCORE_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=miningcore;Password=miningcore-test;Database=miningcore_tests
        run: dotnet test --logger:"console;verbosity=detailed" --no-build --verbosity normal src

      - name: Publish framework-dependent Linux x64 build
        run: >-
          dotnet publish src/Miningcore/Miningcore.csproj
          --configuration Release
          --framework net6.0
          --self-contained false
          --no-restore
          --output publish

      - name: Validate published runtime
        shell: bash
        run: |
          set -euo pipefail

          test -x publish/Miningcore
          file publish/Miningcore | grep -q 'ELF 64-bit.*x86-64'

          if ! compgen -G 'publish/*.so' > /dev/null; then
            echo 'Published archive contains no native Miningcore libraries'
            exit 1
          fi

          while IFS= read -r -d '' binary; do
            echo "Checking runtime links: $binary"
            if ldd "$binary" | tee /tmp/miningcore-ldd.txt | grep -q 'not found'; then
              cat /tmp/miningcore-ldd.txt
              exit 1
            fi
          done < <(find publish -maxdepth 1 -type f \( -name 'Miningcore' -o -name '*.so' \) -print0)

          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/publish" ./publish/Miningcore --version

      - name: Assemble release archive
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.source_date_epoch }}
        run: >-
          bash scripts/release/package-linux-x64.sh
          "${{ steps.version.outputs.version }}"
          "$GITHUB_WORKSPACE/publish"
          "$GITHUB_WORKSPACE/dist"

      - name: Inspect release archive
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check dist/SHA256SUMS
          tar -tzf dist/miningcore-*-linux-x64-ubuntu-22.04.tar.gz

      - name: Upload tested release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  container-check:
    name: Test packaged container
    needs: build-release
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout packaging files
        uses: actions/checkout@v6

      - name: Download tested release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist

      - name: Prepare container context
        shell: bash
        run: |
          set -euo pipefail
          mkdir container-context
          tar -xzf dist/miningcore-*-linux-x64-ubuntu-22.04.tar.gz \
            --strip-components=1 -C container-context

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build packaged container
        uses: docker/build-push-action@v7
        with:
          context: container-context
          file: packaging/docker/Dockerfile.release
          load: true
          push: false
          tags: miningcore-release-test:${{ github.sha }}
          cache-from: type=gha,scope=release-container
          cache-to: type=gha,mode=max,scope=release-container

      - name: Smoke-test packaged container
        run: docker run --rm miningcore-release-test:${{ github.sha }} --version

  publish-release:
    name: Publish GitHub Release and GHCR image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-release, container-check ]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout packaging files
        uses: actions/checkout@v6

      - name: Download tested release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist

      - name: Attest binary archive provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Resolve lowercase GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Prepare container context
        shell: bash
        run: |
          set -euo pipefail
          mkdir container-context
          tar -xzf dist/miningcore-*-linux-x64-ubuntu-22.04.tar.gz \
            --strip-components=1 -C container-context

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Publish packaged container
        id: container
        uses: docker/build-push-action@v7
        with:
          context: container-context
          file: packaging/docker/Dockerfile.release
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=release-container
          cache-to: type=gha,mode=max,scope=release-container

      - name: Attest container provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.container.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          notes='This release contains a tested, framework-dependent **Ubuntu 22.04 x64** build.

          Read the packaged `INSTALL.md` or the [release installation guide](https://github.com/NINJAK1DD/miningcore/blob/dev/docs/releases.md) before deployment. Miningcore still targets the unsupported .NET 6 runtime; install the documented runtime dependencies and complete all required PostgreSQL migrations before startup.'

          release_args=(
            "$GITHUB_REF_NAME"
            dist/*.tar.gz
            dist/SHA256SUMS
            --verify-tag
            --title "Miningcore $GITHUB_REF_NAME"
            --notes "$notes"
            --generate-notes
          )

          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          else
            release_args+=(--latest=true)
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            mkdir existing-release
            gh release download "$GITHUB_REF_NAME" --dir existing-release \
              --pattern 'miningcore-*-linux-x64-ubuntu-22.04.tar.gz' \
              --pattern 'SHA256SUMS'
            cmp dist/SHA256SUMS existing-release/SHA256SUMS
            cmp dist/miningcore-*-linux-x64-ubuntu-22.04.tar.gz \
              existing-release/miningcore-*-linux-x64-ubuntu-22.04.tar.gz
            echo "Release $GITHUB_REF_NAME already exists with identical assets"
            exit 0
          fi

          gh release create "${release_args[@]}"
