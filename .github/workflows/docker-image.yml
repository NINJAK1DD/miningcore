name: Docker Image CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ dev ]
    # Path-filtered checks do not report a status on unrelated pull requests.
    # Do not configure this workflow as a required branch-protection check.
    paths:
      - '.github/workflows/docker-image.yml'

permissions:
  contents: read

jobs:

  build:

    # Docker supplies the Ubuntu 26.04 build userspace. Keep generic publication
    # orchestration on GitHub's current stable runner image.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The docker-container builder is required for the provenance/SBOM inputs below.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to Docker Hub
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: theretromike/miningcore

      - name: Build Docker image (publish only on manual dispatch)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: theretromike/miningcore
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Record published image digest
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Published `theretromike/miningcore@%s` with provenance and SBOM.\n' \
            "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
