name: Docker Image CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ dev ]
    # Path-filtered checks do not report a status on unrelated pull requests.
    # Do not configure this workflow as a required branch-protection check.
    paths:
      - '.github/workflows/docker-image.yml'

permissions:
  contents: read

jobs:

  build:

    # Docker supplies the Ubuntu 26.04 build userspace. Pin orchestration to
    # Ubuntu 24.04 so ubuntu-latest migrations do not change the release host.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      candidate-registry:
        image: registry@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
        ports:
          - 127.0.0.1:5000:5000
        options: >-
          --read-only --cap-drop=ALL --security-opt=no-new-privileges --user=1000:1000
          --tmpfs=/var/lib/registry:rw,nosuid,nodev,size=4294967296,mode=1777

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The docker-container builder is required for the provenance/SBOM inputs below.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."127.0.0.1:5000"]
              http = true

      - name: Install verified publication tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends skopeo python3-yaml

      - name: Test private candidate publication boundary
        timeout-minutes: 10
        run: python3 -B scripts/test-lab/validate-registry-content-gate.py

      - name: Log in to Docker Hub
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: theretromike/miningcore

      - name: Build Docker image for content verification
        timeout-minutes: 38
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: MININGCORE_CONTAINER_APT_TIMEOUT_SECONDS=420
          load: true
          push: false
          tags: theretromike/miningcore
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

      - name: Reject lab artifacts in Docker Hub image layers
        run: python3 -B scripts/release/verify-production-contents.py --image theretromike/miningcore

      # Reuse the same builder/cache and inputs only after its filesystem passed.
      # The registry build retains provenance/SBOM, unsupported by the local load.
      - name: Build runner-private Docker candidate on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: push
        timeout-minutes: 5
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: MININGCORE_CONTAINER_APT_TIMEOUT_SECONDS=420
          push: true
          tags: 127.0.0.1:5000/miningcore:candidate
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Verify staged Docker Hub image contents
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 15
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: python3 -B scripts/release/verify-production-contents.py --registry-image "127.0.0.1:5000/miningcore@$IMAGE_DIGEST"

      - name: Promote and record verified Docker Hub image digest
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          # The helper rechecks the private digest before the first public upload.
          python3 -B scripts/release/publish-verified-image.py \
            --source "127.0.0.1:5000/miningcore@$IMAGE_DIGEST" \
            --destination docker.io/theretromike/miningcore:latest
          printf 'Published `theretromike/miningcore@%s` with provenance and SBOM.\n' \
            "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
