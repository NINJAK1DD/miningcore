name: Stratum listener portability

on:
  push:
    branches: [ master, dev, ravencoin-rollback ]
  pull_request:
    branches: [ master, dev, ravencoin-rollback ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpine-musl:
    name: Exclusive reservation (Alpine/musl)
    # Retain an explicit older-Ubuntu lane as compatibility evidence; the primary Linux
    # build, source container, and release container run on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Run real exclusive-reservation smoke on musl
      shell: bash
      run: |
        set -euo pipefail

        docker run --rm \
          --volume "$GITHUB_WORKSPACE:/workspace" \
          --workdir /workspace \
          --env DOTNET_CLI_TELEMETRY_OPTOUT=1 \
          --env DOTNET_NOLOGO=1 \
          mcr.microsoft.com/dotnet/sdk:10.0-alpine \
          sh -euc '
            apk add --no-cache git
            git config --global --add safe.directory /workspace
            dotnet test src/Miningcore.Tests/Miningcore.Tests.csproj \
              --configuration Release \
              --framework net10.0 \
              --property:MiningcoreStratumListenerSmoke=true \
              --filter "FullyQualifiedName~Miningcore.Tests.Stratum.StratumListenerPortabilityTests"

            if dotnet publish src/Miningcore/Miningcore.csproj \
              --no-restore \
              --no-build \
              --configuration Release \
              --framework net10.0 \
              --property:MiningcoreStratumListenerSmoke=true \
              >/tmp/miningcore-listener-smoke-publish.log 2>&1; then
              echo "The test-only listener smoke unexpectedly produced a publish."
              exit 1
            fi

            grep -F \
              "MiningcoreStratumListenerSmoke is a test-only managed build mode and cannot be used to publish Miningcore." \
              /tmp/miningcore-listener-smoke-publish.log
          '

  macos:
    name: Exclusive reservation (macOS)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: 10.0.x

    - name: Run real exclusive-reservation smoke on macOS
      run: >-
        dotnet test src/Miningcore.Tests/Miningcore.Tests.csproj
        --configuration Release
        --framework net10.0
        --property:MiningcoreStratumListenerSmoke=true
        --filter "FullyQualifiedName~Miningcore.Tests.Stratum.StratumListenerPortabilityTests"
