name: systemd-ordering

on:
  push:
    branches:
      - dev
      - 'fix/**'
  pull_request:

permissions:
  contents: read

jobs:
  postgresql-ordering-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test PostgreSQL systemd ordering helper
        run: bash scripts/release/test-systemd-postgresql-ordering.sh
      - name: ShellCheck PostgreSQL systemd ordering helper
        run: |
          shellcheck packaging/systemd/configure-postgresql-ordering.sh
          shellcheck scripts/release/test-systemd-postgresql-ordering.sh
