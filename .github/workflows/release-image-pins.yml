name: Release image pin freshness

on:
  pull_request:
    branches: [ master, dev, ravencoin-rollback ]
    # Path-filtered checks do not report a status on unrelated pull requests.
    # Do not configure this workflow as a required branch-protection check.
    paths:
      - '.github/workflows/release-image-pins.yml'
      - 'scripts/release/check-linux-release-image-pins.sh'
      - 'scripts/release/run-linux-release-image-pin-monitor.sh'
      - 'scripts/release/linux-release-targets.sh'
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify reviewed Ubuntu image pins
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare current tags with reviewed manifest-list digests
        shell: bash
        run: bash scripts/release/run-linux-release-image-pin-monitor.sh
